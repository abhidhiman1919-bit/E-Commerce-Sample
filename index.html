<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A050E">
<title>Smart Products Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400..800&family=Noto+Sans+Devanagari:wght@400..700&display=swap">
<style>
:root{
  --bg:#2A050E; --s1:#3B0A15; --s2:#4A1020; --field:#430D1B;
  --ink:#FFF4EC; --muted:#D3AEB2; --line:rgba(226,198,140,.16);
  --gold:#D9B772; --gold2:#F2E0B4; --gold-ink:#1B1406;
  --good:#6FD39B; --danger:#FFB3A6; --focus:#F2E0B4;
  --l1:58%; --l2:70%; --l3:30%; --ink-art:#1A0307;
  --shadow:0 2px 0.25rem rgba(20,0,5,.5),0 1.125rem 2.5rem rgba(20,0,5,.55);
  --serif:'Cormorant Garamond','Noto Sans Devanagari',Georgia,'Times New Roman',serif;
  --sans:'Manrope','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gl:max(1.125rem,env(safe-area-inset-left,0px)); --gr:max(1.125rem,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html,body{margin:0}
html{font-size:clamp(13px,.55vw + 10.5px,20px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:var(--ink);font:400 0.9375rem/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(56.25rem 35rem at 85% -5%,rgba(214,40,70,.38),transparent 62%),radial-gradient(50rem 32.5rem at -10% 35%,rgba(160,20,50,.30),transparent 60%),radial-gradient(37.5rem 25rem at 60% 100%,rgba(217,183,114,.07),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.1;text-wrap:balance;font-weight:600}
p{margin:0} img{max-width:100%} [hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:0.1875rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:77.5rem;margin:0 auto;padding:0 var(--gl) 0 var(--gr)}

.lg{position:relative;flex:none;width:2.75rem;height:2.75rem;border-radius:0.75rem;display:grid;place-items:center;overflow:hidden;
  background:transparent;border:1px dashed rgba(217,183,114,.45);font:700 1.625rem/1 var(--serif);color:var(--gold2);pointer-events:none}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent;padding:0}
.lg.has{border:0;background:none;font-size:0;color:transparent;overflow:visible}

.splash{position:fixed;inset:0;z-index:100;background:#1E030A;display:grid;place-items:center;padding:1.5rem;overflow:hidden;cursor:pointer;animation:curtain .9s cubic-bezier(.76,0,.24,1) 3.1s forwards}
@keyframes curtain{to{transform:translateY(-100%);visibility:hidden}}
.splash::before{content:"";position:absolute;width:80vmax;height:80vmax;border-radius:50%;background:radial-gradient(circle,rgba(214,40,70,.35),transparent 60%);animation:glow 2.6s ease-out both}
@keyframes glow{from{opacity:0;transform:scale(.3)}}
.splash-c{position:relative;display:grid;gap:1.25rem;justify-items:center;text-align:center;max-width:100%}
.wm{font-family:var(--serif);font-weight:600;font-size:clamp(2.75rem,12vw,7rem);letter-spacing:-.01em;line-height:1;margin:0;color:var(--gold2);white-space:nowrap;max-width:100%}
.wm span{display:inline-block;white-space:pre;animation:reveal 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.45s + var(--i)*.05s)}
@keyframes reveal{from{opacity:0;transform:translateY(40%);filter:blur(0.5rem)}}
.rule{height:1px;width:0;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:rule 1s cubic-bezier(.2,.8,.2,1) 1.3s forwards}
@keyframes rule{to{width:min(20rem,70vw)}}
.tag{font-size:clamp(0.875rem,3.6vw,1.125rem);letter-spacing:.06em;color:var(--muted);animation:fadeUp .8s ease 1.7s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(0.625rem)}}

.ann{background:linear-gradient(90deg,#4a0a16,#6b1022,#4a0a16);border-bottom:1px solid var(--line);color:var(--gold2);font-size:0.7812rem;letter-spacing:.03em}
.ann div{max-width:77.5rem;margin:0 auto;padding:0.5rem var(--gr) 0.5rem var(--gl);display:flex;justify-content:center;gap:0.625rem 2.125rem;flex-wrap:wrap;text-align:center}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(42,5,14,.78);backdrop-filter:blur(1.125rem) saturate(1.4);-webkit-backdrop-filter:blur(1.125rem) saturate(1.4);border-bottom:1px solid var(--line)}
.top-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand search acts";align-items:center;gap:0.625rem 1.75rem;max-width:77.5rem;margin:0 auto;padding:0.75rem var(--gr) 0.75rem var(--gl)}
.brand{grid-area:brand;min-width:0;display:flex;align-items:center;gap:0.75rem;background:none;border:0;padding:0;color:var(--ink);text-align:left}
.bn{font:600 1.5625rem/1 var(--serif);letter-spacing:.01em;color:var(--gold2);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.search{grid-area:search;display:flex;min-width:0;max-width:37.5rem;width:100%;justify-self:center;background:var(--field);border:1px solid var(--line);border-radius:62.4375rem;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 0.25rem rgba(217,183,114,.15)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:0.75rem 1.125rem;outline:none}
.search input::placeholder{color:var(--muted)}
.search button{border:0;background:none;color:var(--gold);width:3.125rem;display:grid;place-items:center}
.acts{grid-area:acts;display:flex;align-items:center;gap:0.25rem}
.rel{position:relative}
.hbtn{position:relative;display:inline-flex;align-items:center;gap:0.5rem;background:none;border:0;color:var(--ink);padding:0.5625rem 0.75rem;border-radius:62.4375rem;font-weight:600;font-size:0.875rem;transition:background .2s}
.hbtn:hover{background:rgba(217,183,114,.1)}
.ic{position:relative;display:inline-grid}
.badge{position:absolute;top:-0.5625rem;right:-0.6875rem;min-width:1.25rem;height:1.25rem;padding:0 0.3125rem;border-radius:0.625rem;background:var(--gold);color:var(--gold-ink);font-size:0.75rem;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.menu{position:absolute;right:0;top:calc(100% + 0.625rem);width:14.375rem;background:var(--s1);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow);padding:0.875rem;display:grid;gap:0.625rem;z-index:40}
.menu p{color:var(--muted);font-size:0.8125rem}.menu b{color:var(--ink);display:block;font-size:0.9375rem}
@media(max-width:700px){
  .top-in{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand acts" "search search";gap:0.625rem}
  .bn{font-size:1.3125rem}.lg{width:2.375rem;height:2.375rem}.hbtn .lbl{display:none}.hbtn{padding:0.5625rem}.search{max-width:none}
}

@media(max-width:380px){.bn{font-size:1rem}.ann div{font-size:.7rem}.hero h1{font-size:2.4rem}}
@media(min-width:1700px){.wrap,.hero,.hb,.trust-row,.top-in,.foot-in,.copy,.ann div{max-width:84rem}}
.hero{max-width:77.5rem;margin:0 auto;padding:3.5rem var(--gr) 2.5rem var(--gl);display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:center}
.hero h1{font-size:clamp(2.75rem,7vw,5.5rem);font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.hero h1 em{display:block;font-style:italic;font-weight:500;color:var(--gold2)}
.hero p.lead{margin-top:1.25rem;max-width:46ch;color:var(--muted);font-size:1.0625rem}
.hero .cta{margin-top:1.875rem;display:flex;gap:0.875rem;flex-wrap:wrap;align-items:center}
.hero .stats{margin-top:2.375rem;display:flex;gap:2.125rem;flex-wrap:wrap;color:var(--muted);font-size:0.8125rem}
.hero .stats b{display:block;font:600 1.875rem/1 var(--serif);color:var(--ink);margin-bottom:0.25rem}
.hb{max-width:77.5rem;margin:1.1rem auto 1rem;padding:0 var(--gr) 0 var(--gl)}
.best{position:relative;height:clamp(13.5rem,27vw,23rem);border-radius:1.5rem;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--s1)}
.btrk{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.btrk::-webkit-scrollbar{display:none}
.bs{flex:0 0 100%;height:100%;position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;margin:0;padding:0;border:0;overflow:hidden;color:var(--ink);text-align:left;cursor:pointer;scroll-snap-align:center;scroll-snap-stop:always;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(60% 130% at 80% 50%,hsl(var(--h) 70% 40% / .5),transparent 70%),linear-gradient(110deg,#3B0A15,#2A050E 62%,#4A1020)}
.bt{position:relative;z-index:1;display:grid;gap:0.5rem;justify-items:start;align-content:center;padding:0 0.5rem 0 clamp(1.1rem,4.5vw,4rem)}
.bl{font-size:0.6875rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.bh{font:600 clamp(1.3rem,3vw,2.4rem)/1.1 var(--serif);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.bp{display:flex;align-items:baseline;flex-wrap:wrap;gap:0.25rem 0.55rem}
.bp b{font-size:clamp(1.1rem,2.4vw,1.7rem);font-weight:700}
.bp s{color:var(--muted);font-size:clamp(0.75rem,1.3vw,0.95rem)}
.bp em{font-style:normal;background:rgba(217,183,114,.16);color:var(--gold2);font-weight:700;font-size:clamp(0.7rem,1.2vw,0.85rem);padding:0.1rem 0.5rem;border-radius:62.4375rem}
.bcta{margin-top:0.2rem;padding:0.5rem 1.15rem;border-radius:62.4375rem;background:linear-gradient(135deg,#F2E0B4,#D9B772 55%,#B98F45);color:var(--gold-ink);font-weight:700;font-size:clamp(0.78rem,1.4vw,0.95rem);box-shadow:0 0.375rem 1.25rem rgba(217,183,114,.22)}
.bi{position:relative;z-index:1;height:100%;display:grid;place-items:center;padding:0 clamp(.6rem,2.5vw,1.6rem) 0 0}
.bi .ph{display:block;height:90%;aspect-ratio:1/1;max-width:94%;border-radius:1.3rem;overflow:hidden;border:1px solid rgba(217,183,114,.45);box-shadow:0 1.1rem 2.4rem rgba(20,0,5,.6);background:var(--s2)}
.bi .ph svg,.bi .ph img{-webkit-user-drag:none;user-select:none}
.bdots{position:absolute;left:50%;right:0;bottom:0.5rem;z-index:2;display:flex;justify-content:center;align-items:center;gap:0.4rem}
.bdots button{width:0.5rem;height:0.5rem;padding:0;border:0;border-radius:62.4375rem;background:rgba(255,244,236,.4);transition:width .25s,background .25s}
.bdots button[aria-current="true"]{width:1.4rem;background:var(--gold)}
.bcnt{background:rgba(42,5,14,.7);border:1px solid var(--line);color:var(--gold2);font-size:0.72rem;font-weight:700;padding:0.1rem 0.6rem;border-radius:62.4375rem;font-variant-numeric:tabular-nums}
@keyframes float{50%{transform:translateY(-0.75rem)}}
.tagc{font:inherit;position:absolute;right:0;bottom:10%;z-index:2;display:grid;gap:2px;text-align:left;padding:0.75rem 1.125rem;border-radius:1rem;background:rgba(59,10,21,.85);backdrop-filter:blur(0.625rem);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink)}
.tagc small{color:var(--muted);font-size:0.75rem}.tagc b{font:600 1.375rem/1.1 var(--serif);color:var(--gold2)}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:2.125rem;gap:0.625rem}}

.trust-row{max-width:77.5rem;margin:0 auto 1.125rem;padding:0 var(--gr) 0 var(--gl);display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem}
.trust-row div{display:flex;align-items:center;gap:0.75rem;padding:0.875rem 1rem;border:1px solid var(--line);border-radius:1rem;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);font-size:0.8125rem;color:var(--muted)}
.trust-row b{display:block;color:var(--ink);font-size:0.875rem}
.trust-row svg{flex:none;color:var(--gold)}
@media(max-width:820px){.trust-row{grid-template-columns:1fr 1fr}.trust-row div{padding:0.75rem}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;border:1px solid var(--gold);background:linear-gradient(135deg,#F2E0B4,#D9B772 55%,#B98F45);color:var(--gold-ink);font-weight:700;padding:0.8125rem 1.625rem;border-radius:62.4375rem;transition:transform .15s,box-shadow .2s,filter .2s;box-shadow:0 0.375rem 1.375rem rgba(217,183,114,.22)}
.btn:hover{filter:brightness(1.07);box-shadow:0 0.5rem 1.75rem rgba(217,183,114,.34)}
.btn:active{transform:scale(.97)}
.btn.alt,.btn.ghost{background:transparent;color:var(--gold2);box-shadow:none;border-color:var(--line)}
.btn.alt:hover,.btn.ghost:hover{border-color:var(--gold);background:rgba(217,183,114,.08)}
.btn.block{width:100%}
.lnk{background:none;border:0;padding:0;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:0.1875rem}
.lnk.red{color:var(--danger)}

.chips{display:flex;gap:0.625rem;overflow-x:auto;padding:0.375rem 0 1.375rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);padding:0.5625rem 1.375rem;border-radius:62.4375rem;font-weight:600;transition:all .2s}
.chip:hover{color:var(--ink);border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:0.75rem;margin:0.25rem 0 1.375rem;padding-bottom:0.875rem;border-bottom:1px solid var(--line)}
.head h2{font-size:clamp(1.875rem,4.5vw,2.75rem)}.head span{color:var(--muted);font-size:0.875rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.875rem;padding-bottom:4.4rem}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:1.375rem}}
@media(max-width:330px){.grid{grid-template-columns:1fr}}
.card{background:var(--s1);border:1px solid var(--line);border-radius:1.375rem;overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-0.3125rem);border-color:rgba(217,183,114,.5);box-shadow:var(--shadow)}
.card .ph{aspect-ratio:1/1}
.cb{padding:1rem 1rem 1.125rem;display:grid;gap:0.5rem}
.cb h3{font:600 1.25rem/1.2 var(--serif);height:2.4em;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;text-wrap:initial}
.rt{display:flex;align-items:center;gap:0.5rem;color:var(--muted);font-size:0.8125rem}
.pill{background:rgba(217,183,114,.14);color:var(--gold2);font-weight:700;font-size:0.75rem;padding:2px 0.5625rem;border-radius:62.4375rem}
.pr{display:flex;align-items:baseline;gap:0.625rem}.pr b{font-size:1.1875rem;font-weight:700}.pr s{color:var(--muted);font-size:0.8125rem}
.off{position:absolute;top:0.75rem;left:0.75rem;z-index:2;background:rgba(42,5,14,.75);backdrop-filter:blur(0.375rem);border:1px solid var(--line);color:var(--gold2);font-size:0.75rem;font-weight:700;padding:0.25rem 0.625rem;border-radius:62.4375rem}
.empty{text-align:center;padding:3.75rem 1.25rem;display:grid;gap:0.75rem;justify-items:center}
.empty h3{font-size:1.875rem}.empty p{color:var(--muted);max-width:40ch}

.ph{--c1:hsl(var(--h) 55% var(--l1));--c2:hsl(var(--h) 62% var(--l2));--c3:hsl(var(--h) 50% var(--l3));position:relative;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,hsl(var(--h) 60% 50%) 22%,var(--s2)),var(--s1) 75%)}
.ph svg{display:block;width:100%;height:auto}
.ph .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--s1)}
.ph .a{fill:var(--c1)}.ph .b{fill:var(--c2)}.ph .c{fill:var(--c3)}.ph .k{fill:var(--ink-art)}.ph .w{fill:#fff}
.ph .sa,.ph .sb,.ph .sc,.ph .sk,.ph .sw{fill:none}
.ph .sa{stroke:var(--c1)}.ph .sb{stroke:var(--c2)}.ph .sc{stroke:var(--c3)}.ph .sk{stroke:var(--ink-art)}.ph .sw{stroke:#fff}

.back{background:none;border:0;color:var(--muted);padding:1.625rem 0 1.125rem;font-weight:600}.back:hover{color:var(--gold2)}
.dback{padding:1.25rem 0 1rem}
.dt{display:grid;grid-template-columns:1fr 1fr;gap:3rem;padding-bottom:3rem}
.more{border-top:1px solid var(--line);padding-top:2.2rem}
.dt>.ph{border-radius:1.75rem;border:1px solid var(--line);overflow:hidden;aspect-ratio:1/1}
@media(min-width:821px){.dt>.ph{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6.25rem);align-self:start}}
@media(min-width:821px){.dt>.ph{max-height:calc(100vh - 9rem)}}
@media(max-width:820px){.dt{grid-template-columns:1fr;gap:1.1rem}.dt>.ph{aspect-ratio:auto;height:min(42vh,20rem);border-radius:1.25rem}}
.info{display:grid;gap:1rem;align-content:start}
.crumb{color:var(--gold);font-size:0.8125rem;font-weight:600;letter-spacing:.04em}
.info h1{font-size:clamp(2.125rem,5vw,3.5rem)}
.rt.big{font-size:0.875rem}
.price{display:flex;align-items:baseline;gap:0.875rem;flex-wrap:wrap}.price b{font-size:2.125rem;font-weight:700}.price s{color:var(--muted)}.price em{font-style:normal;color:var(--good);font-weight:700}
.desc{color:var(--muted);font-size:1rem;max-width:56ch;overflow-wrap:anywhere}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dmore{justify-self:start;margin-top:-.5rem}
.info h1{overflow-wrap:anywhere}
.pts{list-style:none;margin:0;padding:1.125rem 1.25rem;display:grid;gap:0.625rem;border:1px solid var(--line);border-radius:1.125rem;background:var(--s1)}
.pts li{position:relative;padding-left:1.625rem}
.pts li::before{content:"";position:absolute;left:2px;top:.55em;width:0.625rem;height:0.625rem;border-radius:50%;background:var(--gold)}
div.buy{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:0.6rem;align-items:center;margin:0;
  padding:0.7rem max(var(--gr),calc((100vw - 77.5rem)/2 + var(--gr))) max(0.7rem,env(safe-area-inset-bottom,0px)) max(var(--gl),calc((100vw - 77.5rem)/2 + var(--gl)));
  background:rgba(42,5,14,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -0.5rem 1.5rem rgba(20,0,5,.45)}

.qrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.2rem 0}

@media(max-width:380px){div.buy{gap:0.4rem}div.buy .btn{font-size:0.82rem;padding:0.75rem 0.3rem}}
main:has(div.buy){padding-bottom:5.5rem}
body:has(div.buy) .toast{bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:62.4375rem;background:var(--field)}
.step button{width:2.625rem;height:2.625rem;border:0;background:none;font-size:1.25rem;border-radius:50%;color:var(--gold2)}
.step button:disabled{opacity:.3;cursor:default}
.step output{min-width:1.875rem;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
